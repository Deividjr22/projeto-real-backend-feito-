<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Login</title>

</head>

<body>
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">

        <div class="w-100 p-4 bg-white rounded shadow-sm" style="max-width: 420px;">
            
            <div class="text-center mb-4">
                <div >
                    <!-- colocar no fundo do icone um quadrado azul como esta no marckup -->
                <i class="bi bi-heart-pulse fs-1 text-primary "></i>
                </div>
                <h1 class="h3 mt-3">MedAgenda</h1>
                <p class="text-muted">Sistema de Agendamento e Gestão de Consultorio</p>
            </div>

            <form>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="exampleInputEmail1"
                        aria-describedby="emailHelp" placeholder="contato@medagenda.com.br">
                </div>

                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="exampleInputPassword1" placeholder="*****************">
                </div>

                <div class="mb-3 form-check d-flex justify-content-between align-items-center ps-0">
                    <div>
                        <input type="checkbox" class="form-check-input ms-0 me-2" id="exampleCheck1">
                        <label class="form-check-label" for="exampleCheck1">Lembrar-me</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100"> <a href="Prontuario.html" class="text-white text-decoration-none"> Entrar no MedAgenda</a></button>
                
                <div class="text-center mt-3">
                    <a href="Cadastro.html" class="text-decoration-none">Não tem uma conta? Cadastre-se</a>
                </div>
                <!-- Mensagem de acesso restrito -->
                <div class="text-center fw-light">
                    &nbsp;Acesso restrito para profissionais de saúde credenciados.
                </div>
            </form>

        </div>

    </div>
</body>

</html>
